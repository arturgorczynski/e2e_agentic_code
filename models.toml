# Shared by ALL notebooks and code. Values/credentials live in root .env.
# Change main to "openai", "claude" or "azure" for the ordinary lessons.
[selection]
main = "local"
fallback = "local"
summarizer = "local"
selector = "local"
emulator = "local"
grader = "local"
subagent = "local"

# Optional provider-specific lessons: empty means skipped.
[provider_lessons]
tool_search = ""
openai_moderation = ""
anthropic = ""

[profiles.local]
provider = "ollama"
model_env = "OLLAMA_MODEL"
base_url_env = "OLLAMA_BASE_URL"
temperature = 0
num_ctx = 16384
num_predict = 2048
reasoning = false

[profiles.local.profile]
structured_output = true

[profiles.openai]
provider = "openai"
model_env = "OPENAI_MODEL"
api_key_env = "OPENAI_API_KEY"

[profiles.claude]
provider = "anthropic"
model_env = "ANTHROPIC_MODEL"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 2048

[profiles.azure]
provider = "azure"
deployment_env = "AZURE_OPENAI_DEPLOYMENT"
azure_endpoint_env = "AZURE_OPENAI_ENDPOINT"
api_key_env = "AZURE_OPENAI_API_KEY"
api_version_env = "AZURE_OPENAI_API_VERSION"

[runtime]
request_timeout = 120
recursion_limit = 100

[moderation]
model_env = "OPENAI_MODERATION_MODEL"

[sandbox]
image = "python:3.12-slim"
command_timeout = 3
memory_mb = 128
cpus = "0.5"
