[project]
name = "acme-live-example"
version = "0.1.0"
description = "An observable, approachable LangChain learning application for Acme Wholesale."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.4.5,<2",
    "langchain-ollama>=1.1.0,<2",
    "langchain-openai>=1.7.1,<2",
    "langchain-anthropic>=1.7.6,<2",
    "python-dotenv>=1.2.4,<2",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    "gradio>=6,<7",
    "fastapi>=0.143,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.22,<1",
    "psutil>=7,<8",
    "ddgs>=9.9,<9.10",
    "primp>=0.15,<1",
]

[project.scripts]
acme = "acme.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acme"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
