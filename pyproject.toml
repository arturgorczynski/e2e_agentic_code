[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.1",
    "langchain-anthropic>=1.7.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
middleware = [
    "deepagents>=0.7.25",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
rag = [
    "chromadb>=1.3,<2",
    "ipykernel>=7,<9",
    "matplotlib>=3.9,<4",
    "nbclient>=0.11,<1",
    "nbformat>=5.11,<6",
    "numpy>=2,<3",
    "ollama>=0.5,<1",
    "pillow>=11,<13",
    "rank-bm25>=0.2.2,<1",
    "scikit-learn>=1.6,<2",
    "umap-learn>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["live_example", ".*", "artifacts"]
