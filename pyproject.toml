[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.1",
    "langchain-anthropic>=1.7.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
middleware = [
    "deepagents>=0.7.25",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["live_example", ".*", "artifacts"]
